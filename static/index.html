<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umbra — eclipses from where you stand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0E17; --panel:#10151f; --star:#ECEAE1; --dim:#828da3;
  --solar:#E3A64C; --lunar:#9FC0E8; --line:rgba(236,234,225,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--star);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.hero{padding:64px 0 28px;text-align:center}
.glyph{width:76px;height:76px;border-radius:50%;margin:0 auto 22px;background:#0d1220;
  box-shadow:0 0 0 2px var(--solar),0 0 26px 3px rgba(227,166,76,.55),0 0 72px 12px rgba(227,166,76,.20)}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(48px,10vw,84px);line-height:.9;letter-spacing:-.02em;margin:0 0 12px}
.tag{color:var(--dim);font-size:17px;max-width:40ch;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:28px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--star);font-family:'IBM Plex Mono',monospace;font-size:15px;padding:11px 12px}
input:focus{outline:2px solid var(--solar);outline-offset:1px;border-color:transparent}
.row2{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
button{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer;border-radius:9px;padding:11px 18px;border:1px solid var(--line)}
.btn-primary{background:var(--solar);color:#1a1205;border-color:transparent;flex:1;min-width:160px}
.btn-ghost{background:transparent;color:var(--star)}
button:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 6px;color:var(--dim);font-size:14px}
.toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--dim)}
.event{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;padding:15px 4px;border-top:1px solid var(--line)}
.event.dim{opacity:.4}
.date{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--dim);white-space:nowrap}
.kind{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.kind .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;vertical-align:middle}
.solar .dot{background:var(--solar);box-shadow:0 0 8px var(--solar)}
.lunar .dot{background:var(--lunar);box-shadow:0 0 8px var(--lunar)}
.detail{color:var(--dim);font-size:14px;margin-top:3px}
.empty{color:var(--dim);text-align:center;padding:30px}
footer{color:var(--dim);font-size:12px;text-align:center;padding:40px 0}
footer a{color:var(--star)}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.event{animation:fade .4s ease both}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="glyph" aria-hidden="true"></div>
    <h1>umbra</h1>
    <p class="tag">Every solar and lunar eclipse you could witness from where you stand — computed from first principles.</p>
  </header>
  <section class="panel">
    <div class="grid">
      <div><label for="lat">Latitude</label><input id="lat" inputmode="decimal" value="28.61"></div>
      <div><label for="lon">Longitude</label><input id="lon" inputmode="decimal" value="77.21"></div>
      <div><label for="y0">From year</label><input id="y0" inputmode="numeric"></div>
      <div><label for="y1">To year</label><input id="y1" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <button class="btn-primary" id="go">Find eclipses</button>
      <button class="btn-ghost" id="loc">Use my location</button>
    </div>
  </section>
  <div class="meta" id="meta" hidden>
    <span id="count"></span>
    <label class="toggle"><input type="checkbox" id="showall"> show not-visible</label>
  </div>
  <div id="results"></div>
  <footer>Computed with JPL ephemerides · <a href="https://github.com/MohammadSaqlain124/umbra">source on GitHub</a></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const now = new Date().getFullYear();
$('#y0').value = now; $('#y1').value = now + 10;
let data = [];
$('#loc').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  $('#loc').textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    p => { $('#lat').value = p.coords.latitude.toFixed(2); $('#lon').value = p.coords.longitude.toFixed(2); $('#loc').textContent = 'Use my location'; find(); },
    () => { $('#loc').textContent = 'Use my location'; });
});
$('#go').addEventListener('click', find);
$('#showall').addEventListener('change', render);
async function find(){
  const lat = parseFloat($('#lat').value), lon = parseFloat($('#lon').value);
  const y0 = $('#y0').value, y1 = $('#y1').value;
  if (Number.isNaN(lat) || Number.isNaN(lon)) return;
  $('#results').innerHTML = '<p class="empty">Computing…</p>';
  $('#meta').hidden = true;
  try {
    const r = await fetch(`/api/eclipses?lat=${lat}&lon=${lon}&year_from=${y0}&year_to=${y1}`);
    data = (await r.json()).eclipses;
    render();
  } catch { $('#results').innerHTML = '<p class="empty">Something went wrong. Try again.</p>'; }
}
function render(){
  const showAll = $('#showall').checked;
  const list = data.filter(e => showAll || e.visible);
  $('#meta').hidden = false;
  const vis = data.filter(e => e.visible).length;
  $('#count').textContent = `${vis} visible eclipse${vis===1?'':'s'}`;
  if (!list.length){ $('#results').innerHTML = '<p class="empty">No eclipses in this range.</p>'; return; }
  $('#results').innerHTML = list.map(e => `
    <div class="event ${e.visible?'':'dim'}">
      <span class="date">${e.date}</span>
      <div>
        <div class="kind ${e.category}"><span class="dot"></span>${e.category[0].toUpperCase()+e.category.slice(1)} · ${e.kind}</div>
        <div class="detail">${e.summary}</div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
